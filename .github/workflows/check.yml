name: check

on:
  push:
  pull_request:

# Both jobs run on the self-hosted ephemeral runner, whose image (Arch Linux)
# carries every tool they call: shellcheck, zsh, lua, luajit, jq, gitleaks and
# Hyprland. Jobs run as the non-root runner user, with no sudo and no docker.
jobs:
  lint-and-test:
    runs-on: ${{ vars.RUNS_ON || 'dotfiles-ephemeral' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the secrets scan reads the whole history

      - name: Shell scripts pass shellcheck
        run: |
          shellcheck -s sh config/hypr/scripts/*
          shellcheck install tests/install.test.sh claude/statusline.sh claude/aws-signin-check.sh \
            config/sddm/Xsetup openrgb/openrgb-restore-lighting systemd/hub-watch systemd/docker-prune-built

      - name: zsh files parse
        run: for f in zsh/zshenv zsh/zshrc zsh/functions.zsh; do zsh -n "$f"; done

      - name: Shell helper tests
        run: zsh zsh/functions.test.zsh

      - name: Installer tests
        run: sh tests/install.test.sh

      - name: Lua files parse
        run: |
          for f in config/hypr/*.lua; do luac -p "$f"; done # Arch's lua, the one Hyprland links
          find config/nvim -name '*.lua' -print0 | xargs -0 -n1 luajit -bl > /dev/null

      - name: JSON files parse
        run: git ls-files '*.json' | xargs -r -n1 jq empty

      - name: No secrets in the history
        run: gitleaks git --no-banner --log-opts=--all .

  hyprland:
    runs-on: ${{ vars.RUNS_ON || 'dotfiles-ephemeral' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner image's Hyprland, as fresh as the image's last build.
      - name: Hyprland accepts the config
        run: |
          XDG_RUNTIME_DIR="$RUNNER_TEMP" Hyprland --verify-config -c "$PWD/config/hypr/hyprland.lua" | tee "$RUNNER_TEMP/verify.log"
          grep -qx 'config ok' "$RUNNER_TEMP/verify.log"
