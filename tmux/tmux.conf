# tmux: Arch + Hyprland + kitty, tuned for watching a firstmate crew.
#
# The crew lives in a detached session named "firstmate"; each worker is a
# window named fm-<task-id>. Most of what follows exists so that attaching to
# that session from a kitty window feels like kitty rather than like 1987.
#
# Reload after editing:  prefix + r

# ── Terminal capabilities ────────────────────────────────────────────
# tmux-256color is the correct TERM to advertise inside tmux (it is in
# ncurses-provided terminfo here). kitty then needs truecolor and undercurl
# declared explicitly, or Claude Code's TUI and nvim both render degraded.
set  -s default-terminal    "tmux-256color"
set  -as terminal-features  ",xterm-kitty:RGB"
set  -as terminal-features  ",xterm-kitty:usstyle"

# Pinned rather than left to the default: a tmux upgrade that changes either
# one makes nvim feel broken, and the cause is not obvious months later.
set  -s escape-time  10
set  -s focus-events on

# kitty speaks OSC 52, so let programs inside tmux reach the real clipboard.
set  -s set-clipboard on

# ── Persistence (load-bearing for firstmate) ─────────────────────────
# The crew session is normally detached with no client attached to it.
# destroy-unattached on would delete the whole fleet the moment you detach.
# It is off by default; it is pinned here so it stays that way.
set  -g destroy-unattached off

# Size each window to the client actually looking at it, not to the smallest
# client attached to the session. Without this, windows you are not viewing
# stay pinned at the detached default of 80x24 and reflow when you switch.
setw -g aggressive-resize on

# ── Input ────────────────────────────────────────────────────────────
# Prefix stays C-b: standard everywhere, including any box you SSH into.
set  -g mouse on
setw -g mode-keys vi

# ── Buffers ──────────────────────────────────────────────────────────
# Worker sessions produce long output and tmux's buffer, not kitty's 2000
# lines, is what you actually scroll once attached.
set  -g history-limit 50000

# ── Windows ──────────────────────────────────────────────────────────
# firstmate addresses its windows by stable id (@N), never by index, so
# renumbering on teardown is safe and keeps the list gap-free.
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# allow-rename off (the default, pinned) keeps a program's title escape
# sequence from overwriting an fm-<id> window name.
setw -g allow-rename off

# Deliberately NOT enabling monitor-activity: every worker pane runs a live
# TUI with an animated spinner, so the activity flag would be lit on every
# window at all times and tell you nothing.

# ── Keys ─────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits inherit the current directory; the defaults do not.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Visual selection in copy mode, yanked straight to the Wayland clipboard.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ── Appearance: Catppuccin Frappe, matching config/kitty/current-theme.conf ──
set  -g status-position top
set  -g status-justify  left
set  -g status-interval 5
set  -g status-style "bg=#232634,fg=#C6D0F5"

set  -g status-left  "#[bg=#81C8BE,fg=#232634,bold] #S #[bg=#232634,fg=#232634] "
set  -g status-left-length 32

set  -g status-right "#[fg=#A5ADCE] %a %d %b  %H:%M "
set  -g status-right-length 40

setw -g window-status-format         "#[bg=#292C3C,fg=#C6D0F5] #I:#W#F "
setw -g window-status-current-format "#[bg=#CA9EE6,fg=#232634,bold] #I:#W#F "
setw -g window-status-separator      " "

set  -g pane-border-style        "fg=#51576D"
set  -g pane-active-border-style "fg=#8CAAEE"

set  -g message-style "bg=#E5C890,fg=#232634,bold"
set  -g mode-style    "bg=#F2D5CF,fg=#303446"
