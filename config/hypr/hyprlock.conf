# Lock screen, Catppuccin Mocha. hyprlock has its own config format.
$text = rgb(cdd6f4)
$subtext = rgb(a6adc8)
$blue = rgb(89b4fa)
$mauve = rgb(cba6f7)
$pink = rgb(f5c2e7)
$base = rgb(1e1e2e)
$surface = rgba(31324499)
$clock_font = JetBrainsMono Nerd Font ExtraBold
$label_font = Victor Mono Bold Oblique

general {
    grace = 1
    immediate_render = true
}

background {
    monitor =
    # Symlink maintained by scripts/wallpaper.
    path = $HOME/.local/state/hypr/wallpaper
    color = $base
    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'<b>%A, %-d %B</b>'
    color = $text
    font_size = 18
    font_family = $label_font
    position = 0, -120
    halign = center
    valign = center
}

# Hour, minute, seconds
label {
    monitor =
    text = cmd[update:1000] date +%I
    color = $mauve
    font_size = 240
    font_family = $clock_font
    position = 0, -100
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $blue
    font_size = 240
    font_family = $clock_font
    position = 0, -450
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +'%S %p'
    color = $pink
    font_size = 50
    font_family = $clock_font
    position = 0, -450
    halign = center
    valign = top
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 24
    font_family = $label_font
    position = 0, 280
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $blue
    inner_color = $surface
    font_color = $text
    check_color = $mauve
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    fade_on_empty = false
    font_family = $label_font
    placeholder_text = <i>Password</i>
    position = 0, 120
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] uptime -p
    color = $subtext
    font_size = 18
    font_family = $label_font
    position = -20, 20
    halign = right
    valign = bottom
}
