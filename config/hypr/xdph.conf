# xdg-desktop-portal-hyprland config
#
# force_shm: skip DMA-BUF entirely for screencast and use shared memory.
#
# Why: sharing a whole monitor was black, while window/tab sharing worked.
# The portal log showed output capture failing DMA-BUF negotiation and then
# switching buffer types mid-stream:
#   [ERR] [pw] DMA-BUF fixation failed after 2 attempts, falling back to SHM
#   [WARN] [pipewire] Asked for a wl_shm buffer which is legacy.
# That late renegotiation is what produced the black frame.
#
# Not a multi-GPU problem: the box has a second (Raphael) iGPU, but aquamarine
# only ever starts a backend on the RX 6800 (card1) and xdph only opens that
# card's render node, so no cross-device confusion is involved. The failure is
# modifier fixation on the AMD compressed scanout buffer, and it hits output
# capture only -- window/toplevel capture negotiates fine.
#
# Forcing SHM from the start avoids the failed negotiation. `grim` captures
# outputs correctly over SHM, so the path is known good.
#
# Tradeoff: slightly more CPU than the DMA-BUF path.
#
# Delete this file and restart xdg-desktop-portal-hyprland to revert.
screencopy {
    force_shm = true
}
