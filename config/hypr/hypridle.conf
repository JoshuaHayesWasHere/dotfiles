# hypridle only wires the lock screen to logind here. There are deliberately no
# idle listeners: nothing locks, blanks or suspends this machine on a timer.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
