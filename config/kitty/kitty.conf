# kitty. Colours are Catppuccin Frappe (https://github.com/catppuccin/catppuccin,
# MIT), written out here so the terminal has no theme files to manage. tmux uses
# the same flavour.

font_family      MesloLGS Nerd Font Mono
font_size        16.0

background_opacity      0.9
window_padding_width    4
scrollback_lines        5000
enable_audio_bell       no
confirm_os_window_close 0

map super+shift+v paste_from_selection

foreground            #c6d0f5
background            #303446
selection_foreground  #303446
selection_background  #f2d5cf
cursor                #f2d5cf
cursor_text_color     #303446
url_color             #f2d5cf

active_border_color   #babbf1
inactive_border_color #737994
bell_border_color     #e5c890

active_tab_foreground   #232634
active_tab_background   #ca9ee6
inactive_tab_foreground #c6d0f5
inactive_tab_background #292c3c
tab_bar_background      #232634

# black, red, green, yellow, blue, magenta, cyan, white: normal then bright
color0  #51576d
color8  #626880
color1  #e78284
color9  #e78284
color2  #a6d189
color10 #a6d189
color3  #e5c890
color11 #e5c890
color4  #8caaee
color12 #8caaee
color5  #f4b8e4
color13 #f4b8e4
color6  #81c8be
color14 #81c8be
color7  #b5bfe2
color15 #a5adce
